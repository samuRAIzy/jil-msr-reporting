<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <title>MSR Reporting</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <style>
    :root{--ink:#18352f;--green:#173f35;--mint:#dff2e8;--gold:#e7ad3c;--paper:#fbfcf8;--line:#d9e2dc;--muted:#65756f;--danger:#ad3128}
    *{box-sizing:border-box}body{margin:0;background:#eef2ed;color:var(--ink);font:16px/1.45 Arial,sans-serif}.shell{max-width:920px;margin:auto;min-height:100vh;background:var(--paper);box-shadow:0 0 40px #173f3514}.top{position:sticky;top:0;z-index:10;background:var(--green);color:#fff;padding:18px 22px 12px}.brand{display:flex;justify-content:space-between;align-items:end;gap:18px}.brand h1{font-size:1.45rem;margin:0}.brand p{margin:2px 0 0;color:#cfe0d9;font-size:.85rem}.stepcount{font-weight:700;font-size:.9rem}.track{height:5px;background:#ffffff28;border-radius:9px;margin-top:13px;overflow:hidden}.track span{display:block;height:100%;background:var(--gold);transition:.25s}.main{padding:24px}.intro{background:var(--mint);border-left:5px solid var(--green);padding:15px 17px;margin-bottom:20px;border-radius:0 10px 10px 0}.section{display:none}.section.active{display:block}.section h2{font-size:1.35rem;margin:0 0 6px}.section>.hint{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-weight:700;font-size:.92rem}.sub{font-size:.78rem;color:var(--muted);font-weight:400}input,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);font:inherit;padding:10px 12px}input:focus,select:focus{outline:3px solid #e7ad3c42;border-color:var(--gold)}input[type=number]{text-align:center;font-weight:700}.totalbox{display:flex;justify-content:space-between;align-items:center;background:var(--green);color:#fff;padding:15px 18px;border-radius:10px;margin-top:20px}.totalbox output{font-size:1.6rem;font-weight:800}.nav{display:flex;gap:10px;justify-content:space-between;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}button{border:0;border-radius:9px;padding:12px 18px;font:700 1rem Arial;cursor:pointer}.primary{background:var(--green);color:white}.secondary{background:#e4eae6;color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}.review{display:grid;gap:10px}.review div{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:10px 0}.review strong{text-align:right}.success{text-align:center;padding:35px 10px}.check{width:68px;height:68px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--green);color:white;font-size:2rem}.saved{position:fixed;right:16px;bottom:16px;background:#173f35;color:#fff;padding:9px 13px;border-radius:30px;font-size:.8rem;opacity:0;transition:.2s;pointer-events:none}.saved.show{opacity:1}.error{color:var(--danger);font-weight:700;margin-top:12px}.required:after{content:' *';color:var(--danger)}.modes{display:flex;gap:8px;margin-bottom:20px}.modes button{flex:1}.modes .active{background:var(--green);color:#fff}.yearly{display:none}.yearly.show{display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}.card span{display:block;color:var(--muted);font-size:.78rem}.card strong{font-size:1.3rem}.summaryGroup{margin-top:22px}@media(max-width:620px){.main{padding:20px 16px}.grid,.cards{grid-template-columns:1fr}.field.full{grid-column:auto}.brand p{display:none}.nav button{flex:1}.section h2{font-size:1.25rem}}
    .section{display:block!important;background:#fff;border:1px solid var(--line);border-left:7px solid #2b7a66;border-radius:12px;padding:18px;margin-bottom:16px}
    .section:nth-child(2){border-left-color:#2879b8}.section:nth-child(3){border-left-color:#e7ad3c}.section:nth-child(4){border-left-color:#8b62b3}.section:nth-child(5){border-left-color:#d86655}.section:nth-child(6){border-left-color:#1686a0}.section:nth-child(7){border-left-color:#5f9e42}.section:nth-child(8){border-left-color:#d27b26}.section:nth-child(9){border-left-color:#7966c2}.section:nth-child(10){border-left-color:#bd496d}
    .section h2{padding-bottom:7px;border-bottom:2px solid #eef2ed}.nav .primary{width:100%;background:linear-gradient(135deg,#173f35,#2b7a66);font-size:1.08rem}
  </style>
</head>
<body><div class="shell">
  <header class="top"><div class="brand"><div><h1>MSR Reporting</h1><p>JIL Rotorua • Tokoroa • Taupo</p></div><span class="stepcount" id="stepCount"></span></div><div class="track"><span id="progress"></span></div></header>
  <main class="main"><div class="modes"><button id="monthlyBtn" class="active" onclick="showMode('monthly')">Encode Report</button><button id="yearlyBtn" class="secondary" onclick="showMode('yearly')">Dashboard</button></div><div class="intro" id="intro">Enter current or previous monthly reports from January 2024 onward. Your draft is saved automatically.</div><form id="form"></form><div id="yearly" class="yearly"><h2>MSR Dashboard</h2><p>View everything encoded per outreach.</p><div class="grid"><div class="field"><label>View</label><select id="periodType" onchange="setPeriodOptions()"><option value="monthly">Monthly</option><option value="yearly">Calendar Year</option><option value="financial">Financial Year (April–March)</option></select></div><div class="field"><label>Period</label><select id="periodValue"></select></div><div class="field"><label>Church Outreach</label><select id="summaryOutreach"><option>All Churches</option><option>JIL Rotorua</option><option>JIL Tokoroa</option><option>JIL Taupo</option></select></div></div><div class="nav"><button class="primary" type="button" onclick="loadDashboard()">View Dashboard</button></div><div id="summary"></div></div><div id="message" class="error"></div></main>
</div><div id="saved" class="saved">Draft saved</div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxE88pBBg4xu_A4YaLxrp_lEQGnn5XW4HvgeNCfxd6Eb_3s_TPePwqSP_Zo9zyNRVCL/exec';
const SYNC_KEY='JIL-MSR-RTT-2026';
const outreaches=['JIL Rotorua','JIL Tokoroa','JIL Taupo'];
const people=[['seniorFemale','Senior Adult Female','Age 59 and above'],['seniorMale','Senior Adult Male','Age 59 and above'],['adultFemale','Adult Female','Age 33–59'],['adultMale','Adult Male','Age 33–59'],['yaFemale','YA Female','Age 25–34'],['yaMale','YA Male','Age 25–34'],['cynFemale','CYN Female','Age 13–24'],['cynMale','CYN Male','Age 13–24'],['kidsFemale','Kids Female','Age 12 and below'],['kidsMale','Kids Male','Age 12 and below']];
const peopleS1=people.map(x=>x[0].startsWith('senior')?[x[0],x[1],'Age 60 and above']:x[0].startsWith('adult')?[x[0],x[1],'Age 35–59']:x);
const num=(id,label,hint='')=>({id,label,hint,type:'number'});
const sections=[
 {title:'Report details',hint:'Choose any reporting month from January 2024 onward.',fields:[{id:'country',label:'Country of Operation',type:'text',value:'New Zealand',readonly:true,required:true},{id:'outreach',label:'Church Outreach',type:'select',options:outreaches,required:true},{id:'recordsDate',label:'Reporting Month',hint:'Previous months are allowed from January 2024.',type:'month',min:'2024-01',required:true}]},
 {title:'Source 1 – Church Members',hint:'Members who attend WHS and have a Life Group.',prefix:'s1_',people:true,peopleSet:peopleS1,total:'Source 1 Total'},
 {title:'Source 2 – Church Members',hint:'Members who attend Sunday WHS but do not have a Life Group.',prefix:'s2_',people:true,total:'Source 2 Total'},
 {title:'Source 3 – Church Members',hint:'Regular Life Group attendees who do not attend Sunday WHS.',prefix:'s3_',people:true,total:'Source 3 Total'},
 {title:'Membership totals',hint:'Overall active church membership—not Sunday attendance.',fields:[num('totalMembers','Total Church Members'),num('delistedMembers','Total Number of Delisted Members')]},
 {title:'Sunday Services Attendance – WHS',hint:'Enter the monthly absolute average. Exclude anniversaries and combined services.',prefix:'whs_',people:true,total:'WHS Total Average'},
 {title:'Shepherding Ministry',hint:'Current Life Group numbers for this reporting month.',fields:[num('lifeGroups','Total Number of Life Groups'),num('lifeGroupLeaders','Total Number of Life Group Leaders','Do not include assistants.'),num('lifeGroupMembership','Total Number of LG Membership'),num('lifeGroupAttendance','Total Number of LG Attendance','If unknown, use LG membership.'),num('firstTimers','Grand Total of First Timers')]},
 {title:'Leadership Development Trainings',hint:'Enter the actual number of graduates.',fields:['Pre-Encounter','Encounter Retreat','Post Encounter','SOL 1','SOL 2','SOL 3','Re-Encounter'].map((x,i)=>num('ldt'+i,'LDT – '+x))},
 {title:'Workers',hint:'Leadership and church management strengthening.',fields:[num('workersFull','Workers – Full-time','Employed and paid by the church.'),num('workersPart','Workers – Part-time','Employed and paid by the church.'),num('workersVolunteer','Workers – Volunteer','Unpaid workers, leaders, and volunteers.')]},
 {title:'Finances',hint:'Enter numbers only—no commas or minus signs.',fields:[num('tithes','Tithes'),num('offering','Offering'),num('disbursements','Disbursements'),num('missionOffering','Mission Offering'),num('pledges','Pledges')]},
 {title:'Complete report',hint:'Review the key totals before submitting.',review:true,fields:[{id:'reporter',label:'Your Full Name',hint:'Person who completed this report.',type:'text',required:true}]}
];
let step=0; const form=document.getElementById('form');
function fieldHTML(f){const req=f.required?'required':'';const cls=f.required?'required':'';let control;if(f.type==='select') control=`<select id="${f.id}" ${req}><option value="">Select…</option>${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`;else control=`<input id="${f.id}" type="${f.type}" ${f.type==='number'?'min="0" step="1" inputmode="numeric" value="0"':''} ${f.min?`min="${f.min}"`:''} ${f.value?`value="${f.value}"`:''} ${f.readonly?'readonly':''} ${req}>`;return `<div class="field"><label class="${cls}" for="${f.id}">${f.label}${f.hint?`<br><span class="sub">${f.hint}</span>`:''}</label>${control}</div>`}
function render(){form.innerHTML=sections.map(s=>{const fs=s.fields||(s.peopleSet||people).map(p=>num(s.prefix+p[0],p[1],p[2]));return `<section class="section"><h2>${s.title}</h2><p class="hint">${s.hint}</p><div class="grid">${fs.map(fieldHTML).join('')}</div>${s.total?`<div class="totalbox"><span>${s.total}</span><output id="${s.prefix}total">0</output></div>`:''}${s.review?'<div class="review" id="review"></div><div class="nav"><button type="button" class="primary" onclick="submitReport()">Submit Report</button></div>':''}</section>`}).join('');restore();bind();update();}
function bind(){form.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>{totals();saveDraft();if(document.getElementById('review'))review();}));}
function values(){const d={};form.querySelectorAll('input,select').forEach(x=>d[x.id]=x.type==='number'?Number(x.value||0):x.value);d.country='New Zealand';d.totalMembers=people.reduce((a,p)=>a+['s1_','s2_','s3_'].reduce((b,x)=>b+Number(d[x+p[0]]||0),0),0);d.whsTotal=people.reduce((a,p)=>a+Number(d['whs_'+p[0]]||0),0);return d;}
function totals(){const d=values();['s1_','s2_','s3_','whs_'].forEach(pre=>{const out=document.getElementById(pre+'total');if(out)out.value=people.reduce((a,p)=>a+Number(d[pre+p[0]]||0),0)});const tm=document.getElementById('totalMembers');if(tm&&!tm.dataset.edited)tm.value=d.totalMembers;}
function filterOutreach(){}
function validate(){for(const el of form.querySelectorAll('[required]')){if(!el.value){el.scrollIntoView({behavior:'smooth',block:'center'});el.reportValidity();return false}}return true}
function move(n){if(n>0&&!validate())return;step=Math.max(0,Math.min(sections.length-1,step+n));update();window.scrollTo({top:0,behavior:'smooth'});}
function update(){document.getElementById('stepCount').textContent='Monthly Form';document.getElementById('progress').style.width='100%';totals();review();}
function review(){const d=values();document.getElementById('review').innerHTML=`<div><span>Church Outreach</span><strong>${d.outreach||'—'}</strong></div><div><span>Records Date</span><strong>${d.recordsDate||'—'}</strong></div><div><span>Total Church Members</span><strong>${d.totalMembers}</strong></div><div><span>WHS Total Average</span><strong>${d.whsTotal}</strong></div>`;}
let saveTimer;function saveDraft(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{localStorage.setItem('msrDraft',JSON.stringify(values()));const s=document.getElementById('saved');s.classList.add('show');setTimeout(()=>s.classList.remove('show'),900)},350)}
function restore(){try{const d=JSON.parse(localStorage.getItem('msrDraft')||'{}');Object.entries(d).forEach(([k,v])=>{const el=document.getElementById(k);if(el&&k!=='country')el.value=v});document.getElementById('country').value='New Zealand'}catch(e){}}
async function submitReport(){if(!validate())return;const btn=document.querySelector('.section .primary'),msg=document.getElementById('message');btn.disabled=true;btn.textContent='Saving…';msg.textContent='';try{const report=values();await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveReport',key:SYNC_KEY,report,overwriteExisting:true})});saveLocalReport(report);localStorage.removeItem('msrDraft');document.getElementById('intro').style.display='none';form.innerHTML=`<div class="success"><div class="check">✓</div><h2>Report saved</h2><p>Your report was saved to the dashboard and sent to Google Sheets.</p><button class="primary" onclick="location.reload()">Create another report</button></div>`;document.getElementById('stepCount').textContent='Complete'}catch(error){btn.disabled=false;btn.textContent='Submit Report';msg.textContent='Could not connect. Check your internet and try again.'}}
function showMode(mode){const monthly=mode==='monthly';form.style.display=monthly?'block':'none';document.getElementById('yearly').classList.toggle('show',!monthly);document.getElementById('intro').style.display=monthly?'block':'none';document.getElementById('monthlyBtn').className=monthly?'active':'secondary';document.getElementById('yearlyBtn').className=monthly?'secondary':'active';document.getElementById('stepCount').textContent=monthly?'Monthly Form':'Dashboard';document.getElementById('progress').style.width='100%';}
function setPeriodOptions(){const type=document.getElementById('periodType').value,select=document.getElementById('periodValue'),now=new Date(),year=now.getFullYear();let options=[];if(type==='monthly'){for(let y=year;y>=2024;y--)for(let m=(y===year?now.getMonth()+1:12);m>=1;m--)options.push({v:`${y}-${String(m).padStart(2,'0')}`,t:new Date(y,m-1,1).toLocaleDateString('en-NZ',{month:'long',year:'numeric'})})}else if(type==='yearly'){for(let y=year;y>=2024;y--)options.push({v:y,t:String(y)})}else{for(let y=year;y>=2024;y--)options.push({v:y,t:`April ${y} – March ${y+1}`})}select.innerHTML=options.map(o=>`<option value="${o.v}">${o.t}</option>`).join('');}
function saveLocalReport(report){let reports=[];try{reports=JSON.parse(localStorage.getItem('msrReports')||'[]')}catch(e){}const key=report.outreach+'|'+String(report.recordsDate).slice(0,7),index=reports.findIndex(r=>r.outreach+'|'+String(r.recordsDate).slice(0,7)===key);if(index>=0)reports[index]=report;else reports.push(report);localStorage.setItem('msrReports',JSON.stringify(reports))}
function inPeriod(month,type,value){if(type==='monthly')return month===value;if(type==='yearly')return month.slice(0,4)===String(value);const y=Number(value);return month>=y+'-04'&&month<=(y+1)+'-03'}
function aggregateLocal(reports,church){reports.sort((a,b)=>String(a.recordsDate).localeCompare(String(b.recordsDate)));const latest=reports[reports.length-1]||{},sum=k=>reports.reduce((a,r)=>a+Number(r[k]||0),0),training=['ldt0','ldt1','ldt2','ldt3','ldt4','ldt5','ldt6'];return{church,reportCount:reports.length,latestMembership:Number(latest.totalMembers||0),whsAverage:reports.length?Math.round(sum('whsTotal')/reports.length*10)/10:0,firstTimers:sum('firstTimers'),graduates:training.reduce((a,k)=>a+sum(k),0),tithes:sum('tithes'),offering:sum('offering'),missionOffering:sum('missionOffering'),pledges:sum('pledges'),disbursements:sum('disbursements')}}
function loadDashboard(){const type=document.getElementById('periodType').value,value=document.getElementById('periodValue').value,outreach=document.getElementById('summaryOutreach').value,churches=outreach==='All Churches'?outreaches:[outreach];let reports=[];try{reports=JSON.parse(localStorage.getItem('msrReports')||'[]')}catch(e){}reports=reports.filter(r=>inPeriod(String(r.recordsDate).slice(0,7),type,value));const breakdown=churches.map(c=>aggregateLocal(reports.filter(r=>r.outreach===c),c)),keys=['reportCount','latestMembership','whsAverage','firstTimers','graduates','tithes','offering','missionOffering','pledges','disbursements'],total={church:outreach};keys.forEach(k=>total[k]=Math.round(breakdown.reduce((a,x)=>a+Number(x[k]||0),0)*10)/10);showDashboard({total,breakdown})}
function showDashboard(r){const box=document.getElementById('summary'),x=r.total,money=n=>new Intl.NumberFormat('en-NZ',{style:'currency',currency:'NZD'}).format(n||0);if(!x.reportCount){box.innerHTML='<p class="intro">No reports have been encoded for this selection.</p>';return}box.innerHTML=`<div class="cards"><div class="card"><span>Reports Encoded</span><strong>${x.reportCount}</strong></div><div class="card"><span>Latest Membership</span><strong>${x.latestMembership}</strong></div><div class="card"><span>WHS Average</span><strong>${x.whsAverage}</strong></div><div class="card"><span>First Timers</span><strong>${x.firstTimers}</strong></div><div class="card"><span>Training Graduates</span><strong>${x.graduates}</strong></div></div><div class="summaryGroup"><h3>Finances</h3><div class="cards"><div class="card"><span>Tithes</span><strong>${money(x.tithes)}</strong></div><div class="card"><span>Offering</span><strong>${money(x.offering)}</strong></div><div class="card"><span>Mission Offering</span><strong>${money(x.missionOffering)}</strong></div><div class="card"><span>Pledges</span><strong>${money(x.pledges)}</strong></div><div class="card"><span>Disbursements</span><strong>${money(x.disbursements)}</strong></div></div></div><div class="summaryGroup"><h3>Per Outreach</h3><div class="review">${r.breakdown.map(c=>`<div><span><strong>${c.church}</strong><br><span class="sub">${c.reportCount} report(s)</span></span><strong>${c.latestMembership} members<br><span class="sub">WHS ${c.whsAverage} · Tithes ${money(c.tithes)}</span></strong></div>`).join('')}</div></div>`;}
setPeriodOptions();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');
</script></body></html>
