<body><div class="shell">
  <header class="top"><div class="brand"><div><h1>MSR Reporting</h1><p>JIL Rotorua • Tokoroa • Taupo</p></div><span class="stepcount" id="stepCount"></span></div><div class="track"><span id="progress"></span></div></header>
  <main class="main"><div class="modes"><button id="monthlyBtn" class="active" onclick="showMode('monthly')">Encode Report</button><button id="yearlyBtn" class="secondary" onclick="showMode('yearly')">Dashboard</button></div><div class="intro" id="intro">Enter current or previous monthly reports from January 2024 onward. Your draft is saved automatically.</div><form id="form"></form><div id="yearly" class="yearly"><h2>MSR Dashboard</h2><p>View everything encoded per outreach.</p><div class="grid"><div class="field"><label>View</label><select id="periodType" onchange="setPeriodOptions()"><option value="monthly">Monthly</option><option value="yearly">Calendar Year</option><option value="financial">Financial Year (April–March)</option></select></div><div class="field"><label>Period</label><select id="periodValue"></select></div><div class="field"><label>Church Outreach</label><select id="summaryOutreach"><option>All Churches</option><option>JIL Rotorua</option><option>JIL Tokoroa</option><option>JIL Taupo</option></select></div></div><div class="nav"><button id="syncNowBtn" class="secondary" type="button" onclick="syncNow()">Sync Now</button><button id="refreshDatabaseBtn" class="secondary" type="button" onclick="refreshDatabase()">Refresh Database</button><button class="primary" type="button" onclick="loadDashboard()">View Dashboard</button></div><p id="syncStatus" class="sub" style="text-align:center;margin-top:12px"></p><div id="summary"></div></div><div id="message" class="error"></div></main>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbwdGC4V5Rk4HLKSgC6TVnUVXP-aD1gZ6J5vfvRI0KF-VIqpSGz4rj441qajmKn1xsQV8g/exec';
const SYNC_KEY='JIL-MSR-RTT-2026';
const outreaches=['JIL Rotorua','JIL Tokoroa','JIL Taupo'];
const people=[['seniorFemale','Senior Adult Female','Age 59 and above'],['seniorMale','Senior Adult Male','Age 59 and above'],['adultFemale','Adult Female','Age 33–59'],['adultMale','Adult Male','Age 33–59'],['yaFemale','YA Female','Age 25–34'],['yaMale','YA Male','Age 25–34'],['cynFemale','CYN Female','Age 13–24'],['cynMale','CYN Male','Age 13–24'],['kidsFemale','Kids Female','Age 12 and below'],['kidsMale','Kids Male','Age 12 and below']];
const peopleS1=people.map(x=>x[0].startsWith('senior')?[x[0],x[1],'Age 60 and above']:x[0].startsWith('adult')?[x[0],x[1],'Age 35–59']:x);
const num=(id,label,hint='')=>({id,label,hint,type:'number'});
const reqNum=(id,label,hint='')=>({id,label,hint,type:'number',required:true});
const sections=[
 {title:'Report details',hint:'Choose any reporting month from January 2024 onward.',fields:[{id:'country',label:'Country of Operation',type:'text',value:'New Zealand',readonly:true,required:true},{id:'outreach',label:'Church Outreach',type:'select',options:outreaches,required:true},{id:'recordsDate',label:'Reporting Month',hint:'Previous months are allowed from January 2024.',type:'month',min:'2024-01',required:true}]},
 {title:'Source 1 – Church Members',hint:'Members who attend WHS and have a Life Group.',prefix:'s1_',people:true,peopleSet:peopleS1,total:'Source 1 Total'},
 {title:'Source 2 – Church Members',hint:'Members who attend Sunday WHS but do not have a Life Group.',prefix:'s2_',people:true,total:'Source 2 Total'},
 {title:'Source 3 – Church Members',hint:'Regular Life Group attendees who do not attend Sunday WHS.',prefix:'s3_',people:true,total:'Source 3 Total'},
 {title:'Membership totals',hint:'Overall active church membership—not Sunday attendance.',fields:[num('totalMembers','Total Church Members'),num('delistedMembers','Total Number of Delisted Members')]},
 {title:'Sunday Services Attendance – WHS',hint:'Enter the monthly absolute average. Exclude anniversaries and combined services.',prefix:'whs_',people:true,total:'WHS Total Average'},
 {title:'Shepherding Ministry',hint:'Current Life Group numbers for this reporting month.',fields:[num('lifeGroups','Total Number of Life Groups'),num('lifeGroupLeaders','Total Number of Life Group Leaders','Do not include assistants.'),num('lifeGroupMembership','Total Number of LG Membership'),num('lifeGroupAttendance','Total Number of LG Attendance','If unknown, use LG membership.'),num('firstTimers','Grand Total of First Timers')]},
 {title:'Leadership Development Trainings',hint:'Enter the actual number of graduates.',fields:['Pre-Encounter','Encounter Retreat','Post Encounter','SOL 1','SOL 2','SOL 3','Re-Encounter'].map((x,i)=>num('ldt'+i,'LDT – '+x))},
 {title:'Workers',hint:'Leadership and church management strengthening.',fields:[num('workersFull','Workers – Full-time','Employed and paid by the church.'),num('workersPart','Workers – Part-time','Employed and paid by the church.'),num('workersVolunteer','Workers – Volunteer','Unpaid workers, leaders, and volunteers.')]},
 {title:'Finances',hint:'Enter numbers only—no commas or minus signs.',fields:[num('tithes','Tithes'),num('offering','Offering'),num('disbursements','Disbursements'),num('missionOffering','Mission Offering'),num('pledges','Pledges'),reqNum('totalTithers','Total Number of Tithers')]},
 {title:'Evangelism, Mission and Saturation Church Planting',hint:'Report the areas reached and ministry outcomes for this month.',fields:[reqNum('reachedCities','Reached Area – Cities/Municipalities (or equivalent)','Include the city where the local church is located and cities where Life Groups are located.'),reqNum('reachedSuburbs','Reached Area – Barangays/Suburbs (or equivalent)','Include the suburb where the local church is located and suburbs where Life Groups are located.'),reqNum('evangelized','Total Number Evangelized','First timers and visitors at Sunday services and church events.'),reqNum('discipled','Total Number Discipled','Actual number of people who completed trainings; count each person only once.'),reqNum('waterBaptized','Total Number of Water Baptized')]},
 {title:'Complete report',hint:'Review the key totals before submitting.',review:true,fields:[{id:'reporter',label:'Your Full Name',hint:'Person who completed this report.',type:'text',required:true}]}
];
let step=0; const form=document.getElementById('form');
function fieldHTML(f){const req=f.required?'required':'';const cls=f.required?'required':'';let control;if(f.type==='select') control=`<select id="${f.id}" ${req}><option value="">Select…</option>${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`;else control=`<input id="${f.id}" type="${f.type}" ${f.type==='number'?'min="0" step="1" inputmode="numeric" value="0"':''} ${f.min?`min="${f.min}"`:''} ${f.value?`value="${f.value}"`:''} ${f.readonly?'readonly':''} ${req}>`;return `<div class="field"><label class="${cls}" for="${f.id}">${f.label}${f.hint?`<br><span class="sub">${f.hint}</span>`:''}</label>${control}</div>`}
function render(){form.innerHTML=sections.map(s=>{const fs=s.fields||(s.peopleSet||people).map(p=>num(s.prefix+p[0],p[1],p[2]));return `<section class="section"><h2>${s.title}</h2><p class="hint">${s.hint}</p><div class="grid">${fs.map(fieldHTML).join('')}</div>${s.total?`<div class="totalbox"><span>${s.total}</span><output id="${s.prefix}total">0</output></div>`:''}${s.review?'<div class="review" id="review"></div><div class="nav"><button type="button" class="primary" onclick="submitReport()">Submit Report</button></div>':''}</section>`}).join('');restore();bind();update();}
function bind(){form.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>{totals();saveDraft();if(document.getElementById('review'))review();}));}
function values(){const d={};form.querySelectorAll('input,select').forEach(x=>d[x.id]=x.type==='number'?Number(x.value||0):x.value);d.country='New Zealand';d.totalMembers=people.reduce((a,p)=>a+['s1_','s2_','s3_'].reduce((b,x)=>b+Number(d[x+p[0]]||0),0),0);d.whsTotal=people.reduce((a,p)=>a+Number(d['whs_'+p[0]]||0),0);return d;}
function totals(){const d=values();['s1_','s2_','s3_','whs_'].forEach(pre=>{const out=document.getElementById(pre+'total');if(out)out.value=people.reduce((a,p)=>a+Number(d[pre+p[0]]||0),0)});const tm=document.getElementById('totalMembers');if(tm&&!tm.dataset.edited)tm.value=d.totalMembers;}
function filterOutreach(){}
function validate(){for(const el of form.querySelectorAll('[required]')){if(!el.value){el.scrollIntoView({behavior:'smooth',block:'center'});el.reportValidity();return false}}return true}
function move(n){if(n>0&&!validate())return;step=Math.max(0,Math.min(sections.length-1,step+n));update();window.scrollTo({top:0,behavior:'smooth'});}
function update(){document.getElementById('stepCount').textContent='Monthly Form';document.getElementById('progress').style.width='100%';totals();review();}
function review(){const d=values();document.getElementById('review').innerHTML=`<div><span>Church Outreach</span><strong>${d.outreach||'—'}</strong></div><div><span>Records Date</span><strong>${d.recordsDate||'—'}</strong></div><div><span>Total Church Members</span><strong>${d.totalMembers}</strong></div><div><span>WHS Total Average</span><strong>${d.whsTotal}</strong></div>`;}
let saveTimer;function saveDraft(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{localStorage.setItem('msrDraft',JSON.stringify(values()));const s=document.getElementById('saved');s.classList.add('show');setTimeout(()=>s.classList.remove('show'),900)},350)}
function restore(){try{const d=JSON.parse(localStorage.getItem('msrDraft')||'{}');Object.entries(d).forEach(([k,v])=>{const el=document.getElementById(k);if(el&&k!=='country')el.value=v});document.getElementById('country').value='New Zealand'}catch(e){}}
async function submitReport(){if(!validate())return;const btn=document.querySelector('.section .primary'),msg=document.getElementById('message');btn.disabled=true;btn.textContent='Saving…';msg.textContent='';try{const report=values();await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveReport',key:SYNC_KEY,report,overwriteExisting:true})});saveLocalReport(report);localStorage.removeItem('msrDraft');document.getElementById('intro').style.display='none';form.innerHTML=`<div class="success"><div class="check">✓</div><h2>Report saved</h2><p>Your report was saved to the dashboard and sent to Google Sheets.</p><button class="primary" onclick="location.reload()">Create another report</button></div>`;document.getElementById('stepCount').textContent='Complete'}catch(error){btn.disabled=false;btn.textContent='Submit Report';msg.textContent='Could not connect. Check your internet and try again.'}}
function showMode(mode){const monthly=mode==='monthly';form.style.display=monthly?'block':'none';document.getElementById('yearly').classList.toggle('show',!monthly);document.getElementById('intro').style.display=monthly?'block':'none';document.getElementById('monthlyBtn').className=monthly?'active':'secondary';document.getElementById('yearlyBtn').className=monthly?'secondary':'active';document.getElementById('stepCount').textContent=monthly?'Monthly Form':'Dashboard';document.getElementById('progress').style.width='100%';}
function setPeriodOptions(){const type=document.getElementById('periodType').value,select=document.getElementById('periodValue'),now=new Date(),year=now.getFullYear();let options=[];if(type==='monthly'){for(let y=year;y>=2024;y--)for(let m=(y===year?now.getMonth()+1:12);m>=1;m--)options.push({v:`${y}-${String(m).padStart(2,'0')}`,t:new Date(y,m-1,1).toLocaleDateString('en-NZ',{month:'long',year:'numeric'})})}else if(type==='yearly'){for(let y=year;y>=2024;y--)options.push({v:y,t:String(y)})}else{for(let y=year;y>=2024;y--)options.push({v:y,t:`April ${y} – March ${y+1}`})}select.innerHTML=options.map(o=>`<option value="${o.v}">${o.t}</option>`).join('');}
function saveLocalReport(report){let reports=[];try{reports=JSON.parse(localStorage.getItem('msrReports')||'[]')}catch(e){}const key=report.outreach+'|'+String(report.recordsDate).slice(0,7),index=reports.findIndex(r=>r.outreach+'|'+String(r.recordsDate).slice(0,7)===key);if(index>=0)reports[index]=report;else reports.push(report);localStorage.setItem('msrReports',JSON.stringify(reports))}
function localReports(){try{return JSON.parse(localStorage.getItem('msrReports')||'[]')}catch(e){return[]}}
async function syncNow(){const reports=localReports(),btn=document.getElementById('syncNowBtn'),status=document.getElementById('syncStatus');if(!reports.length){status.textContent='There are no reports on this device to sync.';return}btn.disabled=true;btn.textContent='Syncing…';status.textContent='Sending '+reports.length+' report'+(reports.length===1?'':'s')+' to Google Sheets…';try{await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'syncReports',key:SYNC_KEY,reports})});status.textContent=reports.length+' report'+(reports.length===1?'':'s')+' sent successfully. You may now refresh the database.';}catch(error){status.textContent='Sync failed. Check your internet connection and try again.';}finally{btn.disabled=false;btn.textContent='Sync Now'}}
async function loadRemoteReports(){const url=API_URL+'?action=getReports&key='+encodeURIComponent(SYNC_KEY)+'&t='+Date.now();try{const response=await fetch(url,{method:'GET',cache:'no-store',redirect:'follow'});if(!response.ok)throw new Error('Database returned '+response.status);const data=await response.json();if(!data||data.ok!==true||!Array.isArray(data.reports))throw new Error(data&&data.error||'Invalid database response.');return data.reports}catch(fetchError){return new Promise((resolve,reject)=>{const callback='msrDatabase_'+Date.now()+'_'+Math.floor(Math.random()*10000),script=document.createElement('script'),timer=setTimeout(()=>finish(new Error('Refresh timed out.')),60000);function finish(error,data){clearTimeout(timer);delete window[callback];if(script.parentNode)script.remove();error?reject(error):resolve(data)}window[callback]=data=>{if(!data||data.ok!==true||!Array.isArray(data.reports)){finish(new Error(data&&data.error||'Invalid database response.'));return}finish(null,data.reports)};script.onerror=()=>finish(new Error('Direct connection and backup connection both failed.'));script.src=url+'&callback='+encodeURIComponent(callback);document.body.appendChild(script)})}}
async function refreshDatabase(){const btn=document.getElementById('refreshDatabaseBtn'),status=document.getElementById('syncStatus');btn.disabled=true;btn.textContent='Refreshing…';status.textContent='Loading reports from Google Sheets…';try{const remote=await loadRemoteReports(),merged=new Map(localReports().map(r=>[r.outreach+'|'+String(r.recordsDate).slice(0,7),r]));remote.forEach(r=>{if(r&&r.outreach&&r.recordsDate)merged.set(r.outreach+'|'+String(r.recordsDate).slice(0,7),r)});localStorage.setItem('msrReports',JSON.stringify([...merged.values()]));status.textContent=remote.length+' report'+(remote.length===1?'':'s')+' loaded from Google Sheets.';loadDashboard()}catch(error){status.textContent='Refresh failed: '+error.message;}finally{btn.disabled=false;btn.textContent='Refresh Database'}}
function editReport(outreach,month){const report=localReports().find(r=>r.outreach===outreach&&String(r.recordsDate).slice(0,7)===month);if(!report)return;localStorage.setItem('msrDraft',JSON.stringify(report));render();showMode('monthly');document.getElementById('intro').innerHTML='<strong>Editing '+escapeHtml(outreach)+' – '+monthLabel(month)+'.</strong> Change only what is needed, then tap Update Report.';const btn=document.querySelector('.section .primary');if(btn)btn.textContent='Update Report';window.scrollTo({top:0,behavior:'smooth'})}
async function deleteReport(outreach,month){if(!confirm('Delete '+outreach+' – '+monthLabel(month)+'?\n\nThis will permanently delete it from Google Sheets and all devices.'))return;const status=document.getElementById('syncStatus');status.textContent='Deleting report…';try{await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'deleteReport',key:SYNC_KEY,outreach,recordsDate:month})});const remaining=localReports().filter(r=>!(r.outreach===outreach&&String(r.recordsDate).slice(0,7)===month));localStorage.setItem('msrReports',JSON.stringify(remaining));status.textContent='Report deleted. Refresh Database on other devices to update them.';loadDashboard()}catch(error){status.textContent='Delete failed. Check your internet and try again.'}}
function inPeriod(month,type,value){if(type==='monthly')return month===value;if(type==='yearly')return month.slice(0,4)===String(value);const y=Number(value);return month>=y+'-04'&&month<=(y+1)+'-03'}
function aggregateLocal(reports,church){reports.sort((a,b)=>String(a.recordsDate).localeCompare(String(b.recordsDate)));const latest=reports[reports.length-1]||{},sum=k=>reports.reduce((a,r)=>a+Number(r[k]||0),0),training=['ldt0','ldt1','ldt2','ldt3','ldt4','ldt5','ldt6'];return{church,reportCount:reports.length,latestMembership:Number(latest.totalMembers||0),whsAverage:reports.length?Math.round(sum('whsTotal')/reports.length*10)/10:0,firstTimers:sum('firstTimers'),graduates:training.reduce((a,k)=>a+sum(k),0),tithes:sum('tithes'),offering:sum('offering'),missionOffering:sum('missionOffering'),pledges:sum('pledges'),disbursements:sum('disbursements'),totalTithers:sum('totalTithers')}}
function loadDashboard(){const type=document.getElementById('periodType').value,value=document.getElementById('periodValue').value,outreach=document.getElementById('summaryOutreach').value,churches=outreach==='All Churches'?outreaches:[outreach];const reports=localReports().filter(r=>inPeriod(String(r.recordsDate).slice(0,7),type,value)&&(outreach==='All Churches'||r.outreach===outreach)).sort((a,b)=>String(a.recordsDate).localeCompare(String(b.recordsDate)));const breakdown=churches.map(c=>aggregateLocal(reports.filter(r=>r.outreach===c),c)),keys=['reportCount','latestMembership','whsAverage','firstTimers','graduates','tithes','offering','missionOffering','pledges','disbursements','totalTithers'],total={church:outreach};keys.forEach(k=>total[k]=Math.round(breakdown.reduce((a,x)=>a+Number(x[k]||0),0)*10)/10);if(type!=='monthly'){const monthlyTotals={};reports.forEach(r=>{const month=String(r.recordsDate).slice(0,7);monthlyTotals[month]=(monthlyTotals[month]||0)+Number(r.totalTithers||0)});const monthValues=Object.values(monthlyTotals);total.totalTithers=monthValues.length?Math.round(monthValues.reduce((a,n)=>a+n,0)/monthValues.length*10)/10:0}showDashboard({total,breakdown,reports,type})}
const money=n=>new Intl.NumberFormat('en-NZ',{style:'currency',currency:'NZD'}).format(n||0);
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthLabel=m=>{const [y,n]=String(m).split('-');return new Date(Number(y),Number(n)-1,1).toLocaleDateString('en-NZ',{month:'short',year:'numeric'})};
function fieldLabels(){const labels={totalMembers:'Total Church Members',whsTotal:'WHS Total Average'};sections.forEach(s=>(s.fields||(s.peopleSet||people).map(p=>num(s.prefix+p[0],p[1]))).forEach(f=>labels[f.id]=f.label));return labels}
function chart(title,reports,key,currency=false){const vals=reports.map(r=>Number(r[key]||0)),max=Math.max(1,...vals);return `<div class="chart"><h3>${title}</h3>${reports.map((r,i)=>`<div class="chartRow"><span>${monthLabel(r.recordsDate)}<br>${r.outreach.replace('JIL ','')}</span><div class="barTrack"><div class="bar" style="width:${Math.max(1,vals[i]/max*100)}%"></div></div><strong>${currency?money(vals[i]):vals[i]}</strong></div>`).join('')}</div>`}
function sourceChart(title,reports,prefix){const rows=reports.map(r=>{const copy={...r};copy._sourceTotal=people.reduce((sum,p)=>sum+Number(r[prefix+p[0]]||0),0);return copy});return chart(title,rows,'_sourceTotal')}
function displayValue(id,value){return ['tithes','offering','disbursements','missionOffering','pledges'].includes(id)?money(value):escapeHtml(value||0)}
function reportGroup(section,report){const fs=section.fields||(section.peopleSet||people).map(p=>num(section.prefix+p[0],p[1])),items=fs.filter(f=>report[f.id]!==undefined).map(f=>`<div><span>${escapeHtml(f.label)}</span><strong>${displayValue(f.id,report[f.id])}</strong></div>`);if(section.total){const totalId=section.prefix==='whs_'?'whsTotal':null,totalValue=totalId?report[totalId]:(section.peopleSet||people).reduce((a,p)=>a+Number(report[section.prefix+p[0]]||0),0);items.push(`<div class="groupTotal"><span>${escapeHtml(section.total)}</span><strong>${displayValue(totalId,totalValue)}</strong></div>`)}return items.length?`<section class="dataGroup"><h4>${escapeHtml(section.title)}</h4><div class="allData">${items.join('')}</div></section>`:''}
function reportDetails(report){const month=String(report.recordsDate).slice(0,7),groups=sections.map(s=>reportGroup(s,report)).join('');return `<details class="reportBlock" ${document.getElementById('periodType').value==='monthly'?'open':''}><summary>${monthLabel(month)} · ${escapeHtml(report.outreach)}</summary><div class="reportBody">${groups}<button class="editBtn" type="button" onclick="editReport('${escapeHtml(report.outreach)}','${month}')">Edit This Report</button><button class="deleteBtn" type="button" onclick="deleteReport('${escapeHtml(report.outreach)}','${month}')">Delete This Report</button></div></details>`}
function showDashboard(r){const box=document.getElementById('summary'),x=r.total,tithersLabel=r.type==='monthly'?'Total Number of Tithers':'Average Number of Tithers per Month';if(!x.reportCount){box.innerHTML='<p class="intro">No reports have been encoded for this selection.</p>';return}box.innerHTML=`<div class="cards"><div class="card"><span>Reports Encoded</span><strong>${x.reportCount}</strong></div><div class="card"><span>Latest Membership</span><strong>${x.latestMembership}</strong></div><div class="card"><span>WHS Average</span><strong>${x.whsAverage}</strong></div><div class="card"><span>First Timers</span><strong>${x.firstTimers}</strong></div><div class="card"><span>Training Graduates</span><strong>${x.graduates}</strong></div></div><div class="summaryGroup"><h3>Monthly Comparison</h3>${sourceChart('Source 1 – WHS + Life Group',r.reports,'s1_')}${sourceChart('Source 2 – WHS without Life Group',r.reports,'s2_')}${sourceChart('Source 3 – Life Group without WHS',r.reports,'s3_')}${chart('Church Membership',r.reports,'totalMembers')}${chart('Worship Service Attendance',r.reports,'whsTotal')}${chart('People Evangelized',r.reports,'evangelized')}${chart('People Discipled',r.reports,'discipled')}${chart('Tithes',r.reports,'tithes',true)}${chart('Disbursements',r.reports,'disbursements',true)}</div><div class="summaryGroup"><h3>Finances</h3><div class="cards"><div class="card"><span>Tithes</span><strong>${money(x.tithes)}</strong></div><div class="card"><span>Offering</span><strong>${money(x.offering)}</strong></div><div class="card"><span>Mission Offering</span><strong>${money(x.missionOffering)}</strong></div><div class="card"><span>Pledges</span><strong>${money(x.pledges)}</strong></div><div class="card"><span>Disbursements</span><strong>${money(x.disbursements)}</strong></div><div class="card"><span>${tithersLabel}</span><strong>${x.totalTithers}</strong></div></div></div><div class="summaryGroup"><h3>Complete Encoded Reports</h3><p class="sub">Tap a month to see every answer, edit it, or delete an accidental report.</p>${r.reports.map(reportDetails).join('')}</div>`;}
setPeriodOptions();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');
</script></body></html>
